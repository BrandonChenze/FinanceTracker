{% extends "base.html" %}

{% block header %}
<title>Finance Tracker - Home</title>
{% endblock %}

{% block content %}

<div>
    
<h1>CSV Upload</h1>
    <form action="/upload" method="post" enctype="multipart/form-data">
        Upload file  **[Date,Price,Description,Category] Format Required**
        <br>
        <input id='csv_item' type="file" name="csv_file" accept=".csv">
    </form>
</div>
<button id="upload_csv">Upload</button>

    <div id="add_item">
        <form id="formx">
            <button id="form_cancel" type="button" >X</button>
            <button id="confirm_data_btn" type="button">Confirm</button>
        </form>
        <form id="container" method="post">
            <label>Description:</label>
            <input id="transaction_description" type="text" name="description" placeholder="Description" class="center_text" required>
            
            <label>Category:</label>
            <select id="transaction_category" name="category" class="center_text" required> 
                <option value="Food">Food</option>
                <option value="Amazon">Amazon</option>
                <option value="Gas">Gas</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Health">Health</option>
                <option value="Income">Income</option>
                <option value="Investment">Investment</option>
            </select>
            
            <label>Price:</label>
            <input id="transaction_price" type="number" name="price" step="0.01" min="0" placeholder="$10.99" class="center_text" required>
            
            <label>Date:</label>
            <input id="date_input" type="date" name="date" placeholder="Description" class="center_text" required>
            <button id="add_transaction" type="button">Add</button>
        </form>
    </div>

    <div id="overview">
        
        <fieldset id="budgeting" class="budgeting">
           
            <legend>Budgeting</legend>
            <span class="budgeting_item">Income: <span class="income" id="income_data"></span></span>
            <span class="budgeting_item">Spent: <span id="total_spent" class="credit"></span></span>
            <span class="budgeting_item">Invested: <span id="total_invested" class="credit"></span></span>
            <span class="budgeting_item">Remainder: <span id="remainder" class="income"></span></span>
        </fieldset>
            
        <fieldset id="categories" class="budgeting">
        </fieldset>
    </div>
    
    <div id="transaction_filter">
        Start: <input id="filter_start" name="start" type="date" class="filter">
        End: <input id="filter_end" name="end" type="date" class="filter">
        <a href="/#budgeting"><button type="button" class="filter">Reset Filter</button></a>
       
        <label class="filter">Sort By:
            <select>
                <option>Date</option>
                <option>Price</option>
            </select>
        </label>
    </div>

    <div id="transaction_data">
    </div>

    <div id="page_navigation">
        <a href="?page={{current_page - 1 if current_page > 1 else 1}}#transaction"><button><</button></a>
        <span>Page {{current_page}}</span>
        <a href="?page={{current_page + 1}}#transaction"><button>></button></a>
    </div>
    
{% endblock %}
